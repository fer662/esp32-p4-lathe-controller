name: Controller validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Host regressions (no device access)
        run: python3 tests/run_host_tests.py
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: controller
            options: ''
          - variant: bench
            options: '-DLATHE_BENCH_ONLY=ON -DLATHE_OTA_REQUIRE_PAIRING=ON'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python -m pip install -r requirements-build.txt
          idf.py ${{ matrix.options }} build
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- dependencies.lock
      - name: Real-widget preview and pointer regressions
        if: matrix.variant == 'controller'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cmake -S tests/ui_preview -B build-ui-preview
          cmake --build build-ui-preview --target ui_preview -j 2
          cd build-ui-preview
          ./ui_preview
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: |
            build/esp32-p4-lathe-controller.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
          if-no-files-found: error
